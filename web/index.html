<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketPulse — Alexa+ Skill Simulation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #0f1b2d;
         color: #e8eef6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  header { padding: 28px 16px 8px; text-align: center; }
  .ring { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 12px;
          background: radial-gradient(circle at 35% 35%, #4cc2ff, #146ef5 70%);
          box-shadow: 0 0 42px rgba(76,194,255,.55); animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.06);} }
  h1 { font-size: 22px; font-weight: 700; }
  .sub { color: #8fa3bd; font-size: 13px; margin-top: 4px; }
  .badge { display:inline-block; font-size:11px; background:#1b2f4b; color:#7fd0ff;
           border:1px solid #2b4a73; border-radius:20px; padding:3px 10px; margin-top:8px; }
  #chat { width: min(680px, 94vw); flex: 1; overflow-y: auto; padding: 18px 6px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width: 85%; padding: 11px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #146ef5; border-bottom-right-radius: 4px; }
  .alexa { align-self: flex-start; background: #1b2f4b; border-bottom-left-radius: 4px; }
  .toolchip { align-self: flex-start; font-size: 11px; color: #7fd0ff; background:#12233a;
              border:1px dashed #2b4a73; border-radius:8px; padding:5px 10px; }
  .thinking { align-self:flex-start; color:#8fa3bd; font-style:italic; font-size:13px; }
  #bar { width: min(680px, 94vw); display: flex; gap: 8px; padding: 12px 0 22px; }
  #q { flex:1; padding: 13px 16px; border-radius: 24px; border:1px solid #2b4a73;
       background:#16283f; color:#e8eef6; font-size:15px; outline:none; }
  #q:focus { border-color:#4cc2ff; }
  #send { padding: 0 22px; border-radius: 24px; border: none; background:#146ef5;
          color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  #send:disabled { opacity:.5; cursor:default; }
  .suggest { display:flex; flex-wrap:wrap; gap:8px; width:min(680px,94vw); padding:0 0 4px; }
  .suggest button { font-size:12.5px; background:#16283f; color:#a9c4e2; border:1px solid #2b4a73;
                    border-radius:18px; padding:7px 13px; cursor:pointer; }
  .suggest button:hover { border-color:#4cc2ff; color:#e8eef6; }
  table { border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  td, th { border: 1px solid #2b4a73; padding: 5px 9px; text-align: left; }
  th { background:#12233a; }
</style>
</head>
<body>
<header>
  <div class="ring"></div>
  <h1>MarketPulse</h1>
  <div class="sub">Market research skill for Alexa+ &mdash; simulated experience</div>
  <div class="badge">SIMULATED ALEXA+ HOST &middot; MCP Streamable HTTP &middot; Amazon Bedrock</div>
</header>
<div id="chat"></div>
<div class="suggest" id="suggest"></div>
<div id="bar">
  <input id="q" placeholder='Ask anything, e.g. "revenue for health_beauty"' autocomplete="off">
  <button id="send">Ask</button>
</div>
<script>
const chat = document.getElementById('chat'), q = document.getElementById('q'),
      sendBtn = document.getElementById('send'), suggest = document.getElementById('suggest');
const examples = [
  "What is the revenue for health_beauty?",
  "Show me growth trends for electronics",
  "Which categories have the worst late delivery?",
  "What are the top selling products?",
  "Give me a market intelligence brief"
];
examples.forEach(e => { const b = document.createElement('button'); b.textContent = e;
  b.onclick = () => { q.value = e; send(); }; suggest.appendChild(b); });
function add(cls, html) { const d = document.createElement('div'); d.className = 'msg ' + cls;
  d.innerHTML = html; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d; }
function chip(t, a) { const d = document.createElement('div'); d.className = 'toolchip';
  d.textContent = '⚙ MCP tool called: ' + t + (a && Object.keys(a).length ? ' ' + JSON.stringify(a) : '');
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; }
function money(n){ return n==null ? '—' : 'R$ ' + Number(n).toLocaleString('en-US',{maximumFractionDigits:0}); }
function render(d) {
  const insight = d.insight ? '<br><br>💡 <i>' + esc(d.insight) + '</i>' : '';
  const prov = d.powered_by ? ' <span style="font-size:10px;color:#5b7190">[' + esc(d.powered_by) + ']</span>' : '';
  if (d.answer) return esc(d.answer) + prov;
  if (d.brief) return '<b>Market brief</b><br>' + esc(d.brief) + prov;
  if (d.a && d.b) {
    let h = `<b>${esc(d.a.category)} vs ${esc(d.b.category)}</b><table><tr><th></th><th>${esc(d.a.category)}</th><th>${esc(d.b.category)}</th></tr>`;
    h += `<tr><td>Revenue</td><td>${money(d.a.total_revenue_brl)}</td><td>${money(d.b.total_revenue_brl)}</td></tr>`;
    h += `<tr><td>Orders</td><td>${Number(d.a.total_orders).toLocaleString()}</td><td>${Number(d.b.total_orders).toLocaleString()}</td></tr>`;
    h += `<tr><td>Avg review</td><td>${d.a.avg_review ?? '—'}</td><td>${d.b.avg_review ?? '—'}</td></tr>`;
    h += `<tr><td>Avg delivery</td><td>${d.a.avg_delivery_days ?? '—'}d</td><td>${d.b.avg_delivery_days ?? '—'}d</td></tr></table>`;
    h += `<br>🏆 Revenue winner: <b>${esc(d.winner_by_revenue || '')}</b>`;
    return h + insight + prov;
  }
  if (d.found !== undefined) {
    if (!d.found) return 'I could not find that category.' +
      (d.did_you_mean ? '<br>Did you mean: ' + d.did_you_mean.join(', ') : '');
    return `<b>${esc(d.category)}</b><br>Revenue: ${money(d.total_revenue_brl)}<br>` +
      `Orders: ${Number(d.total_orders).toLocaleString()}<br>Avg review: ${d.avg_review_score ?? '—'} / 5<br>` +
      `Avg delivery: ${d.avg_delivery_days ?? '—'} days` + insight + prov;
  }
  if (d.months) { let h = `<b>Trend (${esc(d.category||'all')}) — ${d.trend_direction||''}</b><table><tr><th>Month</th><th>Revenue</th><th>Orders</th></tr>`;
    d.months.slice(-6).forEach(m => h += `<tr><td>${m.month}</td><td>${money(m.revenue_brl)}</td><td>${m.orders}</td></tr>`);
    return h + '</table>'; }
  if (d.products) { let h = '<b>Top products</b><table><tr><th>Product</th><th>Revenue</th><th>Units</th></tr>';
    d.products.forEach(p => h += `<tr><td>${p.product_id.slice(0,8)}… (${esc(p.category||'')})</td><td>${money(p.revenue_brl)}</td><td>${p.units_sold}</td></tr>`);
    return h + '</table>'; }
  if (d.score_distribution) { let h = '<b>Review scores</b><table><tr><th>Score</th><th>Orders</th></tr>';
    d.score_distribution.forEach(r => h += `<tr><td>${r.score}★</td><td>${Number(r.orders).toLocaleString()}</td></tr>`);
    h += '</table><br><b>Best rated:</b> ' + d.best_rated_categories.slice(0,3).map(c=>esc(c.category)+' '+c.avg_score).join(', ');
    return h; }
  if (d.categories) { let h = '<b>Delivery performance</b><table><tr><th>Category</th><th>Avg days</th><th>Late %</th></tr>';
    d.categories.slice(0,6).forEach(c => h += `<tr><td>${esc(c.category)}</td><td>${c.avg_delivery_days??'—'}</td><td>${c.late_delivery_rate!=null?(c.late_delivery_rate*100).toFixed(1)+'%':'—'}</td></tr>`);
    return h + '</table>'; }
  return '<pre>' + esc(JSON.stringify(d, null, 1).slice(0, 1200)) + '</pre>';
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function send() {
  const text = q.value.trim(); if (!text) return;
  add('user', esc(text)); q.value = ''; sendBtn.disabled = true;
  const th = document.createElement('div'); th.className = 'thinking'; th.textContent = '● ● ●';
  chat.appendChild(th); chat.scrollTop = chat.scrollHeight;
  try {
    const r = await fetch('/api/ask', { method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({question:text}) });
    const j = await r.json(); th.remove();
    if (j.error) { add('alexa', 'Sorry, that hit a snag: ' + esc(j.error)); }
    else { chip(j.tool, j.args); add('alexa', render(j.data)); }
  } catch(e) { th.remove(); add('alexa', 'Sorry, I could not reach the skill service.'); }
  sendBtn.disabled = false; chat.scrollTop = chat.scrollHeight;
}
sendBtn.onclick = send;
q.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
add('alexa', 'Hi! I\'m MarketPulse. Ask me about e-commerce market data — revenue, trends, reviews, delivery, or a full brief.');
</script>
</body>
</html>
