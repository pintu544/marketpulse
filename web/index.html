<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketPulse on Alexa+</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #000;
         color: #e8eef6; min-height: 100vh; display: flex; flex-direction: column;
         align-items: center; overflow-x: hidden; }
  /* Alexa ring */
  #stage { position: relative; width: 100%; max-width: 900px; display: flex;
           flex-direction: column; align-items: center; padding: 34px 16px 10px; }
  #ring { width: 150px; height: 150px; border-radius: 50%; position: relative;
          background: radial-gradient(circle at 38% 35%, #6fd3ff, #146ef5 68%, #0a3fa0);
          box-shadow: 0 0 70px rgba(76,194,255,.45); transition: all .4s; cursor: pointer; }
  #ring::after { content:""; position:absolute; inset:14px; border-radius:50%;
          background: radial-gradient(circle at 40% 35%, rgba(255,255,255,.35), transparent 60%); }
  #ring.listening { animation: listen 1.1s ease-in-out infinite; box-shadow: 0 0 110px rgba(76,194,255,.85); }
  #ring.thinking { animation: think 1.6s linear infinite; }
  #ring.speaking { animation: speak .7s ease-in-out infinite; }
  @keyframes listen { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
  @keyframes think { 0%{filter:hue-rotate(0)} 100%{filter:hue-rotate(360deg)} }
  @keyframes speak { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  #state { margin-top: 14px; font-size: 15px; color: #8fa3bd; min-height: 22px; }
  #heard { margin-top: 6px; font-size: 20px; font-weight: 600; min-height: 28px; text-align:center; padding: 0 20px;}
  /* Response cards */
  #cards { width: min(860px, 96vw); display: flex; flex-direction: column; gap: 14px;
           padding: 16px 8px 30px; }
  .card { background: linear-gradient(160deg, #14273f, #0e1c30); border: 1px solid #23405f;
          border-radius: 18px; padding: 18px 20px; animation: rise .45s ease-out; }
  @keyframes rise { from { opacity:0; transform: translateY(14px);} to { opacity:1; transform:none;} }
  .card h3 { font-size: 16px; color: #7fd0ff; margin-bottom: 10px; font-weight: 600; }
  .card .answer { font-size: 17px; line-height: 1.55; }
  .card .insight { margin-top: 10px; padding-top: 10px; border-top: 1px solid #23405f;
                  font-style: italic; color: #b9cde6; font-size: 15px; }
  .toolchip { font-size: 11px; color: #5f7a99; margin-top: 10px; }
  .toolchip b { color: #7fd0ff; font-weight: 600; }
  .bignum { font-size: 34px; font-weight: 700; color: #fff; }
  .bignum small { font-size: 14px; color: #8fa3bd; font-weight: 400; display:block; margin-top:2px;}
  .statrow { display: flex; gap: 18px; flex-wrap: wrap; margin: 12px 0 4px; }
  .stat { flex: 1; min-width: 130px; }
  .winner { margin-top: 12px; font-size: 16px; }
  .winner b { color: #ffd47f; }
  canvas.chart { max-height: 260px; margin-top: 8px; }
  table { border-collapse: collapse; margin-top: 10px; font-size: 13.5px; width: 100%; }
  td, th { border: 1px solid #23405f; padding: 6px 10px; text-align: left; }
  th { background: #12233a; color: #7fd0ff; }
  /* Controls */
  #controls { position: fixed; bottom: 0; left: 0; right: 0; display: flex;
              justify-content: center; gap: 10px; padding: 14px;
              background: linear-gradient(transparent, rgba(0,0,0,.92) 40%); }
  #micBtn { width: 64px; height: 64px; border-radius: 50%; border: none; cursor: pointer;
            background: radial-gradient(circle at 35% 30%, #4cc2ff, #146ef5 75%);
            box-shadow: 0 0 30px rgba(76,194,255,.5); font-size: 26px; }
  #micBtn.off { background: #2a3b52; box-shadow: none; }
  #typeBox { display: flex; gap: 8px; align-items: center; }
  #q { width: min(420px, 58vw); padding: 13px 18px; border-radius: 26px;
       border: 1px solid #2b4a73; background: #101f33; color: #e8eef6;
       font-size: 15px; outline: none; }
  #q:focus { border-color: #4cc2ff; }
  #send { padding: 12px 20px; border-radius: 26px; border: none; background: #146ef5;
          color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  #hint { font-size: 12px; color: #5f7a99; margin-top: 10px; text-align: center; padding: 0 16px 90px; }
  .badge { font-size: 11px; color: #7fd0ff; border: 1px solid #2b4a73; border-radius: 20px;
           padding: 4px 12px; margin-top: 10px; background: rgba(20,110,245,.12); }
</style>
</head>
<body>
<div id="stage">
  <div id="ring" title="Tap to talk"></div>
  <div id="state">Tap the ring or the mic, then ask</div>
  <div id="heard"></div>
  <div class="badge">SIMULATED ALEXA+ DEVICE &middot; MCP STREAMABLE HTTP &middot; AMAZON BEDROCK</div>
</div>
<div id="cards"></div>
<div id="hint">Try: "revenue for health beauty" &middot; "compare health beauty versus electronics" &middot; "biggest risk in electronics" &middot; "market brief"</div>
<div id="controls">
  <button id="micBtn" title="Voice input">🎙</button>
  <div id="typeBox">
    <input id="q" placeholder="Or type your question…" autocomplete="off">
    <button id="send">Ask</button>
  </div>
</div>
<script>
const ring = document.getElementById('ring'), state = document.getElementById('state'),
      heard = document.getElementById('heard'), cards = document.getElementById('cards'),
      q = document.getElementById('q'), micBtn = document.getElementById('micBtn');
let charts = [];
function setMode(m, label) {
  ring.className = m || '';
  state.textContent = label || '';
}
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function money(n){ return n==null ? '—' : 'R$ ' + Number(n).toLocaleString('en-US',{maximumFractionDigits:0}); }

/* ---------- voice ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (SR) {
  rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true;
  rec.onresult = e => {
    let txt = ''; for (const r of e.results) txt += r[0].transcript;
    heard.textContent = '“' + txt + '”';
    if (e.results[e.results.length-1].isFinal) { stopListen(); send(txt); }
  };
  rec.onend = () => { if (listening) rec.start(); };
  rec.onerror = () => stopListen();
}
function startListen() {
  if (!rec) { state.textContent = 'Voice not supported in this browser — type instead'; return; }
  listening = true; micBtn.classList.remove('off');
  setMode('listening', 'Listening…'); heard.textContent = '';
  try { rec.start(); } catch(e){}
}
function stopListen() {
  listening = false; micBtn.classList.add('off');
  try { rec && rec.stop(); } catch(e){}
}
micBtn.classList.add('off');
micBtn.onclick = () => listening ? stopListen() : startListen();
ring.onclick = () => listening ? stopListen() : startListen();

function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.02;
    u.onstart = () => setMode('speaking', 'Speaking…');
    u.onend = () => setMode('', 'Tap the ring or the mic, then ask');
    speechSynthesis.speak(u);
  } catch(e){ setMode('', 'Tap the ring or the mic, then ask'); }
}

/* ---------- cards ---------- */
function addCard(title, html, tool, args, provider) {
  const d = document.createElement('div'); d.className = 'card';
  d.innerHTML = `<h3>${esc(title)}</h3>${html}` +
    (tool ? `<div class="toolchip">⚙ <b>${esc(tool)}</b>${args ? ' · ' + esc(JSON.stringify(args)) : ''}${provider ? ' · ' + esc(provider) : ''}</div>` : '');
  cards.prepend(d);
  d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  return d;
}
function trendChart(id, months) {
  const el = document.getElementById(id);
  if (!el || typeof Chart === 'undefined') return;
  charts.forEach(c => { try{c.destroy()}catch(e){} }); charts = [];
  charts.push(new Chart(el, { type: 'line',
    data: { labels: months.map(m => m.month),
      datasets: [{ label: 'Revenue (R$)', data: months.map(m => m.revenue_brl),
        borderColor: '#4cc2ff', backgroundColor: 'rgba(76,194,255,.15)', fill: true, tension: .35 }]},
    options: { plugins: { legend: { labels: { color: '#8fa3bd' } } },
      scales: { x: { ticks: { color: '#5f7a99' } }, y: { ticks: { color: '#5f7a99' } } } }
  }));
}

function render(d, tool, args) {
  const prov = d.powered_by || '';
  const say = d.insight || d.answer || d.brief || '';
  if (say) speak(say.length > 420 ? say.slice(0, 420) + '…' : say);

  if (d.answer) {
    addCard('Market analyst', `<div class="answer">${esc(d.answer)}</div>`, tool, args, prov);
  } else if (d.brief) {
    addCard('Market intelligence brief',
      `<div class="answer">${esc(d.brief).replace(/\n\n/g,'<br><br>')}</div>`, tool, args, prov);
  } else if (d.a && d.b) {
    const h = `<div class="statrow">
        <div class="stat"><div class="bignum">${money(d.a.total_revenue_brl)}<small>${esc(d.a.category)} revenue</small></div></div>
        <div class="stat"><div class="bignum">${money(d.b.total_revenue_brl)}<small>${esc(d.b.category)} revenue</small></div></div>
      </div>
      <table><tr><th></th><th>${esc(d.a.category)}</th><th>${esc(d.b.category)}</th></tr>
      <tr><td>Orders</td><td>${Number(d.a.total_orders).toLocaleString()}</td><td>${Number(d.b.total_orders).toLocaleString()}</td></tr>
      <tr><td>Avg review</td><td>${d.a.avg_review ?? '—'}</td><td>${d.b.avg_review ?? '—'}</td></tr>
      <tr><td>Avg delivery</td><td>${d.a.avg_delivery_days ?? '—'} days</td><td>${d.b.avg_delivery_days ?? '—'} days</td></tr></table>
      <div class="winner">🏆 Revenue winner: <b>${esc(d.winner_by_revenue || '')}</b></div>
      ${d.insight ? `<div class="insight">💡 ${esc(d.insight)}</div>` : ''}`;
    addCard(`${d.a.category} vs ${d.b.category}`, h, tool, args, prov);
  } else if (d.months) {
    const id = 'ch' + Math.random().toString(36).slice(2, 8);
    const h = `<div class="statrow">
        <div class="stat"><div class="bignum">${esc(d.trend_direction || '').toUpperCase()}<small>trend · ${esc(d.category || 'all')}</small></div></div>
      </div><canvas class="chart" id="${id}"></canvas>
      ${d.insight ? `<div class="insight">💡 ${esc(d.insight)}</div>` : ''}`;
    const card = addCard('Growth trends', h, tool, args, prov);
    setTimeout(() => trendChart(id, d.months.slice(-12)), 60);
  } else if (d.products) {
    let h = `<table><tr><th>Product</th><th>Revenue</th><th>Units</th></tr>`;
    d.products.slice(0,6).forEach(p => h += `<tr><td>${esc(p.product_id.slice(0,8))}…</td><td>${money(p.revenue_brl)}</td><td>${p.units_sold}</td></tr>`);
    h += `</table>${d.insight ? `<div class="insight">💡 ${esc(d.insight)}</div>` : ''}`;
    addCard('Top products', h, tool, args, prov);
  } else if (d.score_distribution) {
    let h = `<div class="statrow">`;
    d.score_distribution.forEach(r => h += `<div class="stat"><div class="bignum">${r.score}★<small>${Number(r.orders).toLocaleString()} orders</small></div></div>`);
    h += `</div><div class="insight">Best rated: ${d.best_rated_categories.slice(0,3).map(c=>esc(c.category)+' ('+c.avg_score+')').join(', ')}</div>`;
    h += d.insight ? `<div class="insight">💡 ${esc(d.insight)}</div>` : '';
    addCard('Review insights', h, tool, args, prov);
  } else if (d.categories) {
    let h = `<table><tr><th>Category</th><th>Avg days</th><th>Late %</th></tr>`;
    d.categories.slice(0,6).forEach(c => h += `<tr><td>${esc(c.category)}</td><td>${c.avg_delivery_days ?? '—'}</td><td>${c.late_delivery_rate != null ? (c.late_delivery_rate*100).toFixed(1)+'%' : '—'}</td></tr>`);
    h += `</table>${d.insight ? `<div class="insight">💡 ${esc(d.insight)}</div>` : ''}`;
    addCard('Delivery performance', h, tool, args, prov);
  } else if (d.found !== undefined && d.found) {
    const h = `<div class="statrow">
        <div class="stat"><div class="bignum">${money(d.total_revenue_brl)}<small>revenue</small></div></div>
        <div class="stat"><div class="bignum">${Number(d.total_orders).toLocaleString()}<small>orders</small></div></div>
        <div class="stat"><div class="bignum">${d.avg_review_score ?? '—'}<small>avg review / 5</small></div></div>
        <div class="stat"><div class="bignum">${d.avg_delivery_days ?? '—'}<small>avg delivery days</small></div></div>
      </div>${d.insight ? `<div class="insight">💡 ${esc(d.insight)}</div>` : ''}`;
    addCard(esc(d.category), h, tool, args, prov);
  } else if (d.error) {
    addCard('Hmm', `<div class="answer">I hit a snag: ${esc(d.error)}</div>`, tool, args, prov);
    speak('Sorry, I hit a snag.');
  } else {
    addCard('Result', `<pre style="font-size:12px">${esc(JSON.stringify(d, null, 1).slice(0, 900))}</pre>`, tool, args, prov);
  }
}

/* ---------- ask ---------- */
async function send(text) {
  text = (text || q.value).trim(); if (!text) return;
  q.value = ''; stopListen();
  heard.textContent = '“' + text + '”';
  setMode('thinking', 'Thinking…');
  try {
    const r = await fetch('/api/ask', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text }) });
    const j = await r.json();
    if (j.error) { setMode('', ''); addCard('Hmm', `<div class="answer">${esc(j.error)}</div>`); speak('Sorry, something went wrong.'); }
    else render(j.data, j.tool, j.args);
  } catch (e) {
    setMode('', ''); addCard('Hmm', `<div class="answer">I couldn't reach the skill service.</div>`);
  }
}
document.getElementById('send').onclick = () => send();
q.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
setMode('', 'Tap the ring or the mic, then ask');
</script>
</body>
</html>
